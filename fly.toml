# fly.toml app configuration file generated for next-dns-mcp
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "next-dns-mcp"
primary_region = "arn"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  ALLOWED_HOSTS = "next-dns-mcp.fly.dev"
  PUBLIC_BASE_URL = "https://next-dns-mcp.fly.dev"
  OAUTH_CLIENT_ID = "nextdns-mcp-claude"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
